# Orders test classes by @Order, defaulting an unannotated class to Order.DEFAULT (1). This exists
# for YukonEndpointsSeamTest: see its own class-level @Order for why it must run before any other
# test class that installs a resolver into the YukonEndpoints bootstrap singleton.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
