version: v2
modules:
  - path: src/main/proto
    name: buf.build/otherlode/otherlode
lint:
  use:
    - STANDARD
  except:
    # The rule requires each value to start with its enum's name. Every
    # generated constant would then repeat the type name (Go
    # ProbeKind_PROBE_KIND_METHOD, Java ProbeKind.PROBE_KIND_METHOD), and the
    # value names the collector and server read would change.
    - ENUM_VALUE_PREFIX
    # GeneratedBy's zero value means "not generated", a legitimate and common
    # value rather than an absent or invalid one, unlike ProbeKind's own
    # PROBE_KIND_UNSPECIFIED. Naming it GENERATED_BY_UNSPECIFIED would
    # misstate what it means for the sake of this rule alone.
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
