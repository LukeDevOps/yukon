version: v2
modules:
  - path: src/main/proto
    name: buf.build/lukedevops-oss/yukon
lint:
  use:
    - STANDARD
  except:
    # Renaming to satisfy these would rename the generated Java enum
    # constants and move the package (yukon -> yukon.v1), a breaking change
    # for the agent and collector's existing generated code. Not worth it
    # for a schema that already ships.
    - PACKAGE_DIRECTORY_MATCH
    - PACKAGE_VERSION_SUFFIX
    - ENUM_VALUE_PREFIX
    # GeneratedBy's zero value means "not generated", a legitimate and common
    # value rather than an absent or invalid one, unlike ProbeKind's own
    # PROBE_KIND_UNSPECIFIED. Naming it GENERATED_BY_UNSPECIFIED would
    # misstate what it means for the sake of this rule alone.
    - ENUM_ZERO_VALUE_SUFFIX
breaking:
  use:
    - FILE
