# Orders test classes by @Order, defaulting an unannotated class to Order.DEFAULT (1). This exists
# for EndpointEndToEndTest: see its own class-level @Order for why it must run before any other
# test class in this module that starts a YukonTestCollector, which is itself a JDK HttpServer.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
